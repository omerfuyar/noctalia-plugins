id = "omerfuyar/agenda"
name = "Agenda"
version = "1.0.0"
plugin_api = 43
author = "omerfuyar"
license = "MIT"
icon = "calendar-event"
description = "Your next calendar event in the bar, with a countdown and a Join button, from the calendars set up in Noctalia."
dependencies = ["noctalia", "xdg-open"]
tags = ["bar", "productivity", "time"]

[[setting]]
key = "days"
type = "int"
label_key = "settings.days.label"
description_key = "settings.days.description"
default = 7
min = 1
max = 14

[[setting]]
key = "soon_minutes"
type = "int"
label_key = "settings.soon_minutes.label"
description_key = "settings.soon_minutes.description"
default = 15
min = 1
max = 120

[[setting]]
key = "hidden_calendars"
type = "string_list"
label_key = "settings.hidden_calendars.label"
description_key = "settings.hidden_calendars.description"
default = []
advanced = true

[[widget]]
id = "widget"
entry = "widget.luau"

  [[widget.setting]]
  key = "show_title"
  type = "bool"
  label_key = "settings.show_title.label"
  description_key = "settings.show_title.description"
  default = true

[[panel]]
id = "panel"
entry = "panel.luau"
width = 400
height = "content"
max_height = 600
placement = "attached"
position = "auto"
open_near_click = true
