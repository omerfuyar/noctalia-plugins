name: Catalog

on:
  push:
    branches: [main]
    paths-ignore: [catalog.toml]
  workflow_dispatch:

concurrency:
  group: catalog
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate catalog.toml
        run: .github/scripts/catalog.sh
      - name: Commit catalog.toml
        run: |
          git add catalog.toml
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "- Update catalog.toml"
          git push
