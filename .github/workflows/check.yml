name: Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install luau-lsp
        env:
          VERSION: 1.70.1
          SHA256: 1a2ea1ae4f98f8946cefd970a4b54853e11ab4775e6932faa7f60cf920346567
        run: |
          curl -fsSL -o "$RUNNER_TEMP/luau-lsp.zip" \
            "https://github.com/JohnnyMorganz/luau-lsp/releases/download/$VERSION/luau-lsp-linux-x86_64.zip"
          echo "$SHA256  $RUNNER_TEMP/luau-lsp.zip" | sha256sum -c --quiet
          unzip -q "$RUNNER_TEMP/luau-lsp.zip" -d "$RUNNER_TEMP/luau-lsp"
          echo "$RUNNER_TEMP/luau-lsp" >> "$GITHUB_PATH"
      - name: Check plugins
        run: .github/scripts/check.sh
