id = "omerfuyar/screen-control"
name = "Screen Control"
version = "1.1.1"
plugin_api = 43
author = "omerfuyar"
license = "MIT"
icon = "sun"
description = "Manage brightness per monitor, extra dim below the lowest brightness, night light and caffeine. All in one bar widget."
dependencies = ["noctalia", "hyprsunset", "hyprctl", "ddcutil"]
tags = ["bar", "system", "utility"]

[[setting]]
key = "max_dim"
type = "int"
label_key = "settings.max_dim.label"
description_key = "settings.max_dim.description"
default = 75
min = 10
max = 99

[[setting]]
key = "per_workspace"
type = "bool"
label_key = "settings.per_workspace.label"
description_key = "settings.per_workspace.description"
default = false

[[service]]
id = "service"
entry = "service.luau"

[[widget]]
id = "widget"
entry = "widget.luau"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 380
height = "content"
max_height = 560
placement = "attached"
position = "auto"
open_near_click = true

[[layer]]
id = "dim"
entry = "layer.luau"
layer = "overlay"
anchors = ["top", "bottom", "left", "right"]
exclusive_zone = -1
click_through = true
